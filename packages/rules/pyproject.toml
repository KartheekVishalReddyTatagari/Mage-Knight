[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mk-rules"
version = "0.1.0"
description = "Pure rules engine for Mage Knight Online"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["mk_rules"]
branch = true
omit = [
    "*/engine.py",
    "*/actions.py",
    "*/events.py",
    "*/movement.py",
    "*/progression.py",
]

[tool.coverage.report]
fail_under = 40
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Stub files kept for student exercises — unused imports are intentional hints
"src/mk_rules/engine.py"      = ["F401"]
"src/mk_rules/actions.py"     = ["F401"]
"src/mk_rules/events.py"      = ["F401"]
"src/mk_rules/movement.py"    = ["F401"]
"src/mk_rules/progression.py" = ["F401"]

[tool.mypy]
strict = true
python_version = "3.12"
