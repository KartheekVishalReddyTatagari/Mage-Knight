name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Pure rules engine ────────────────────────────────────────────────────
  rules-engine:
    name: Rules Engine (lint + test + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rules

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev tools
        run: pip install -e . pytest pytest-cov ruff

      - name: Lint
        run: ruff check src

      - name: Test + coverage
        run: pytest --cov=mk_rules --cov-report=term-missing -v

  # ── 2. FastAPI server ───────────────────────────────────────────────────────
  server:
    name: Server (lint + import smoke test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: |
          pip install \
            fastapi \
            "uvicorn[standard]" \
            "pydantic[email]" \
            sqlalchemy \
            "passlib[argon2]" \
            "python-jose[cryptography]"

      - name: Lint (ruff)
        run: pip install ruff && ruff check apps/server/src

      - name: Smoke test — server starts cleanly
        # Run from apps/server so Python picks up the src/ package correctly.
        # The import executes main.py startup (creates SQLite DB + seeds admin).
        run: |
          cd apps/server
          python -c "from src.main import app; print('Server startup OK')"

  # ── 3. React / Vite frontend ────────────────────────────────────────────────
  web:
    name: Web Client (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (production bundle)
        run: npm run build
