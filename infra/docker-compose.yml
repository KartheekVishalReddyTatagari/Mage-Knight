# Local development stack — run with:  docker compose up
#
# Services:
#   db     — PostgreSQL (accounts, action log, snapshots)
#   redis  — Redis (active session state, pub/sub)
#   server — FastAPI server (hot-reload via --reload)
#
# After first run:
#   docker compose exec server alembic upgrade head   ← apply DB migrations

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     mk_user
      POSTGRES_PASSWORD: mk_pass
      POSTGRES_DB:       mk_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mk_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mk_user:mk_pass@db:5432/mk_db
      REDIS_URL:    redis://redis:6379
      SECRET_KEY:   dev_secret_change_in_production
    volumes:
      - ../apps/server:/app/server          # mount for hot-reload
      - ../packages/rules:/app/rules
      - ../packages/content:/app/content
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../apps/web:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  pg_data:
